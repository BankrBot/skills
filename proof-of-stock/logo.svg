<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 0 92 92" width="256" height="256" role="img" aria-label="Proof of Stock">
  <title>Proof of Stock guard</title>
  <defs>
    <linearGradient id="g-plate" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1B2742"/>
      <stop offset="0.45" stop-color="#0D1526"/>
      <stop offset="1" stop-color="#070C18"/>
    </linearGradient>
    <linearGradient id="g-rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#A9C8FF"/>
      <stop offset="0.35" stop-color="#4B87FF"/>
      <stop offset="0.75" stop-color="#1E4FD8"/>
      <stop offset="1" stop-color="#15347F"/>
    </linearGradient>
    <linearGradient id="g-disc" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#9CC0FF"/>
      <stop offset="0.4" stop-color="#4B87FF"/>
      <stop offset="1" stop-color="#2A5FD8"/>
    </linearGradient>
    <linearGradient id="g-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g-glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#4B87FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4B87FF" stop-opacity="0"/>
    </radialGradient>
    <path id="g-shape" d="M40 4 72 13v30c0 18.5-12.8 32.4-32 41.6C20.8 75.4 8 61.5 8 43V13z"/>
    <clipPath id="g-clip"><use href="#g-shape"/></clipPath>
    <filter id="f-drop" x="-30%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#04070F" flood-opacity="0.75"/>
    </filter>
    <filter id="f-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceAlpha" dx="0" dy="1.4" result="o"/>
      <feGaussianBlur in="o" stdDeviation="1.1" result="b"/>
      <feFlood flood-color="#04070F" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#f-drop)">
    <use href="#g-shape" fill="url(#g-plate)"/>
    <g clip-path="url(#g-clip)">
      <rect x="0" y="0" width="80" height="92" fill="url(#g-glow)"/>
      <path d="M8 13 40 4l32 9v16c-10 6.5-22 10-32 10S18 35.5 8 29z" fill="url(#g-gloss)"/>
      <g filter="url(#f-emboss)" transform="translate(40 43) scale(2.55) translate(-8 -8)">
        <circle cx="8" cy="8" r="7" fill="url(#g-disc)"/>
        <path d="M-8 8h14V6h4v2h14v1H9V7H7v2H-8z" fill="#0B1020" fill-opacity="0.92"/>
      </g>
    </g>
    <use href="#g-shape" fill="none" stroke="url(#g-rim)" stroke-width="3" stroke-linejoin="round"/>
    <use href="#g-shape" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1" stroke-linejoin="round" transform="translate(0 1.1) scale(0.985) translate(0.6 0)"/>
  </g>
</svg>
