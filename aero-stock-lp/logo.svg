<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- aero-stock-lp: a price band with the price line running in range -->
  <rect width="96" height="96" rx="20" fill="#0B0E14"/>
  <!-- band -->
  <rect x="14" y="32" width="68" height="32" rx="6" fill="#8B5CF6" opacity="0.16"/>
  <line x1="14" y1="32" x2="82" y2="32" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="14" y1="64" x2="82" y2="64" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <!-- price path staying inside the band -->
  <path d="M14 54 L30 44 L44 52 L58 40 L72 48" fill="none" stroke="#E9E4FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- current price dot -->
  <circle cx="72" cy="48" r="6" fill="#8B5CF6"/>
  <circle cx="72" cy="48" r="6" fill="none" stroke="#E9E4FF" stroke-width="2"/>
</svg>
