<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- hood-stock-lp: a price band with the price line running in range, Robinhood green -->
  <rect width="96" height="96" rx="20" fill="#0B0E14"/>
  <!-- band -->
  <rect x="14" y="32" width="68" height="32" rx="6" fill="#00C805" opacity="0.14"/>
  <line x1="14" y1="32" x2="82" y2="32" stroke="#00C805" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="14" y1="64" x2="82" y2="64" stroke="#00C805" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <!-- price path staying inside the band -->
  <path d="M14 50 L28 58 L42 42 L56 50 L72 40" fill="none" stroke="#E6FFE7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- current price dot -->
  <circle cx="72" cy="40" r="6" fill="#00C805"/>
  <circle cx="72" cy="40" r="6" fill="none" stroke="#E6FFE7" stroke-width="2"/>
</svg>
