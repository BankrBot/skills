    <path d="M872 369h302l20 38-48 38H872l-20-38 20-38Z" fill="url(#logoEyes)"/>
  </g>
  <path d="M443 382h268l10 19H431l12-19Zm446 0h268l12 19H879l10-19Z" fill="#ffffff" opacity=".24"/>

  <path d="M151 356h46v75h-46v-75Zm1252 0h46v75h-46v-75Z" fill="#00dbff"/>
  <path d="M151 460h46v72h-46v-72Zm1252 0h46v72h-46v-72Z" fill="#ff205d"/>
</svg>
